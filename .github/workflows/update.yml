name: Update and publish

on:
  schedule:
    - cron: "17 14,2 * * *"   # ~7am and ~7pm Pacific
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data/**", "README.md"]   # the bot's own data commits don't retrigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # PDFs and extracted text are cached between runs so each run only reads new documents
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables plain-English summaries
        run: python scraper/run.py

      - name: Build site
        run: python site/build.py --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Commit data changes
        run: |
          git config user.name "duvall-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projects.json data/meetings.json data/events.json data/state.json data/records.json
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
