name: Update data

# Scrapes the city's public records twice a day and commits the results to data/.
# Hosting is Cloudflare Pages, connected to this repo: every commit to main triggers a
# Cloudflare build (build command: python site/build.py --site-url https://duvallwatch.dog/,
# output directory: public), so a data commit here is what publishes new alerts.

on:
  schedule:
    - cron: "17 14,2 * * *"   # ~7am and ~7pm Pacific
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # PDFs and extracted text are cached between runs so each run only reads new documents
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: pdf-cache-

      - name: Scrape
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: enables plain-English summaries
        run: python scraper/run.py

      # same build Cloudflare runs; fails the job before committing data that would break the site
      - name: Check the site builds
        run: python site/build.py --site-url https://duvallwatch.dog/

      - name: Commit data changes
        run: |
          git config user.name "duvall-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/projects.json data/meetings.json data/events.json data/state.json data/records.json
          git diff --cached --quiet || git commit -m "Data update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
